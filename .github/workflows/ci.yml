name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm run test
      
    - name: Run type checking
      run: npm run typecheck
      
    - name: Run linting
      run: npm run lint
      
    - name: Check translation extraction
      run: npm run extract
      
    - name: Check for untranslated strings
      run: |
        echo "Checking for untranslated strings..."
        if npm run check-translations; then
          echo "✅ All translations are complete"
        else
          echo "⚠️ Some strings are not translated yet - this is informational only"
        fi
      
    - name: Build project
      run: npm run build